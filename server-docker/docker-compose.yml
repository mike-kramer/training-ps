name: training-ps-prod

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in server-docker/.env}
    volumes:
      - app_code:/var/www/html:ro
      - app_storage:/var/www/html/storage:ro
      - ./nginx/templates/${NGINX_TEMPLATE:-default.http-only.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - php
    networks:
      - training-ps

  php:
    <<: &php-service
      build:
        context: ..
        dockerfile: server-docker/php/Dockerfile
      image: training-ps-php:prod
      restart: unless-stopped
      volumes:
        # Code comes from the image (/opt/app-src → app_code via entrypoint).
        - app_code:/var/www/html
        - app_storage:/var/www/html/storage
        # Only secret/config file from the host — not the application tree.
        - ./application.env:/var/www/html/.env
      environment: &php-env
        DB_HOST: db
        DB_PORT: 5432
        DB_DATABASE: ${POSTGRES_DB:-training-ps}
        DB_USERNAME: ${POSTGRES_USER:-training-ps}
        DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server-docker/.env}
        REDIS_HOST: redis
        REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in server-docker/.env}
        # Workers inherit 0; primary php overrides to 1 below.
        RUN_SETUP: "0"
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_started
      networks:
        - training-ps
    environment:
      <<: *php-env
      RUN_SETUP: "1"
    # service_started fires as soon as the entrypoint process starts — not after rsync.
    # Wait until setup wrote .container-ready and artisan can load the autoloader.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /var/www/html/storage/app/.container-ready && php /var/www/html/artisan --version >/dev/null",
        ]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 30s

  horizon:
    <<: *php-service
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      php:
        condition: service_healthy

  scheduler:
    <<: *php-service
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      php:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-training-ps}
      POSTGRES_USER: ${POSTGRES_USER:-training-ps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server-docker/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-training-ps} -d ${POSTGRES_DB:-training-ps}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - training-ps

  redis:
    image: redis:8.8.1-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in server-docker/.env} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - training-ps

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    profiles:
      - certbot

volumes:
  app_code:
  app_storage:
  postgres_data:
  redis_data:
  certbot_www:
  certbot_certs:

networks:
  training-ps:
    driver: bridge
